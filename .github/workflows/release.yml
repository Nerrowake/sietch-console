name: Release

# Triggered by pushing a version tag: git tag v0.1.0-alpha.1 && git push --tags
on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    name: Build, package, and release
    runs-on: windows-latest
    permissions:
      contents: write   # required to create GitHub Releases

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Strip the leading "v" from the tag to get a bare version string
      - name: Extract version
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Restore dependencies
        run: dotnet restore

      # Produce a single self-contained win-x64 executable
      - name: Publish (win-x64, single file)
        run: >
          dotnet publish "Sietch Console/Sietch Console.csproj"
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=embedded
          -o publish/

      # List publish output so we can verify loose files (OxyPlot DLLs etc.) in the Actions log
      - name: List publish output
        run: Get-ChildItem publish/ | Select-Object Name, Length | Format-Table -AutoSize

      # Portable ZIP — zip from inside publish/ so files land at the archive root, not in a subfolder
      - name: Create portable ZIP
        run: |
          Push-Location publish
          Compress-Archive -Path * -DestinationPath "../SietchConsole-${{ steps.version.outputs.VERSION }}-win-x64-portable.zip"
          Pop-Location

      # Verify ZIP contents so the Actions log shows exactly what's in the archive
      - name: Verify portable ZIP contents
        run: >
          Add-Type -AssemblyName System.IO.Compression.FileSystem;
          [System.IO.Compression.ZipFile]::OpenRead("SietchConsole-${{ steps.version.outputs.VERSION }}-win-x64-portable.zip").Entries |
          Select-Object Name, Length |
          Format-Table -AutoSize

      # Windows installer via Inno Setup
      - name: Compile installer (Inno Setup)
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.4
        with:
          path: Installer/sietch-console.iss
          options: /DAppVersion=${{ steps.version.outputs.VERSION }}

      # Delete any existing release for this tag to avoid "already_exists" conflicts
      # from repeated tag pushes. Ignore errors if no release exists yet.
      - name: Delete existing release (if any)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "v${{ steps.version.outputs.VERSION }}" --repo ${{ github.repository }} --yes 2>$null || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Sietch Console ${{ steps.version.outputs.VERSION }}
          draft: false
          prerelease: true
          generate_release_notes: true
          files: |
            SietchConsole-${{ steps.version.outputs.VERSION }}-win-x64-portable.zip
            Output/SietchConsole-${{ steps.version.outputs.VERSION }}-Setup.exe
