name: Release

# Triggered by pushing a version tag: git tag v0.1.0-alpha.1 && git push --tags
on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    name: Build, package, and release
    runs-on: windows-latest
    permissions:
      contents: write   # required to create GitHub Releases

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Strip the leading "v" from the tag to get a bare version string
      - name: Extract version
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Restore dependencies
        run: dotnet restore

      # Produce a single self-contained win-x64 executable
      - name: Publish (win-x64, single file)
        run: >
          dotnet publish "Sietch Console/Sietch Console.csproj"
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=embedded
          -o publish/

      # Portable ZIP — no installer required
      - name: Create portable ZIP
        run: >
          Compress-Archive
          -Path publish/*
          -DestinationPath "SietchConsole-${{ steps.version.outputs.VERSION }}-win-x64-portable.zip"

      # Windows installer via Inno Setup
      - name: Compile installer (Inno Setup)
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.4
        with:
          path: Installer/sietch-console.iss
          options: /DAppVersion=${{ steps.version.outputs.VERSION }}

      # Draft release — promote to published manually after QA
      - name: Create GitHub Release (draft)
        uses: softprops/action-gh-release@v2
        with:
          name: Sietch Console ${{ steps.version.outputs.VERSION }}
          draft: false
          prerelease: true
          generate_release_notes: true
          files: |
            SietchConsole-${{ steps.version.outputs.VERSION }}-win-x64-portable.zip
            Output/SietchConsole-${{ steps.version.outputs.VERSION }}-Setup.exe
